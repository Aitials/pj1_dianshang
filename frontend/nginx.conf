server {
    listen       80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # gzip 压缩：前端打包后单个 JS 体积较大，开压缩能明显降低首屏传输量
    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # ① SPA 路由回退：前端用的是 createWebHistory（HTML5 History 模式），
    #    没有这段时，在 /orders/xxx 这类子路由上刷新页面会 404 ——
    #    因为磁盘上并不存在 orders/xxx 这个文件，必须交回 index.html 让 Vue Router 接管。
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ② 接口反向代理：前端 axios 的 baseURL 是相对路径 '/api'，
    #    由 Nginx 转发到后端容器。因为浏览器看到的始终是同源（只访问 80 端口），
    #    所以后端不需要配置 CORS。
    #    proxy_pass 后面不带路径，原始 URI 会被完整保留：/api/orders → backend:8000/api/orders
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # AI 问答要等大模型返回，默认 60s 容易超时中断
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    # ③ 后端健康检查接口（public，无鉴权）
    location = /healthy {
        proxy_pass http://backend:8000/healthy;
        proxy_set_header Host $host;
    }

    # ④ 静态资源长缓存：文件名带 hash，内容变了文件名就变，可以放心长时间缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }
}